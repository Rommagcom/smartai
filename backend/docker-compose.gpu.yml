# Override for using Ollama on host machine (GPU) while all SmartAI services run in containers.
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d --build

services:
  api:
    environment:
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_started
      milvus-standalone:
        condition: service_started
      redis:
        condition: service_started

  scheduler-leader:
    environment:
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_started
      milvus-standalone:
        condition: service_started
      redis:
        condition: service_started

  worker:
    environment:
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_started
      milvus-standalone:
        condition: service_started
      redis:
        condition: service_started

  # Disable local Ollama container in this mode.
  ollama:
    profiles: ["local-ollama-disabled"]
