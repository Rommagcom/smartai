services:
  ollama:
    image: ollama/ollama:latest
    container_name: sai-ollama
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 5s
      retries: 10

  ollama-pull:
    image: ollama/ollama:latest
    container_name: sai-ollama-pull
    restart: "no"
    env_file:
      - .env
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command: |
      set -e
      model="$${OLLAMA_MODEL:-gpt-oss:120b-cloud}"
      embedding_model="$${LONG_TERM_MEMORY_EMBEDDING_MODEL:-nomic-embed-text:latest}"
      echo "Waiting for Ollama API at $${OLLAMA_HOST}..."
      until ollama list >/dev/null 2>&1; do
        sleep 2
      done

      attempt=1
      max_attempts=5
      while [ "$$attempt" -le "$$max_attempts" ]; do
        echo "Pulling $$model (attempt $$attempt/$$max_attempts)..."
        if ollama pull "$$model"; then
          echo "Model $$model pulled successfully"
          break
        fi
        attempt=$$((attempt + 1))
        sleep 5
      done

      if [ "$$attempt" -gt "$$max_attempts" ]; then
        echo "Failed to pull $$model after $$max_attempts attempts"
        exit 1
      fi

      attempt=1
      while [ "$$attempt" -le "$$max_attempts" ]; do
        echo "Pulling $$embedding_model (attempt $$attempt/$$max_attempts)..."
        if ollama pull "$$embedding_model"; then
          echo "Embedding model $$embedding_model pulled successfully"
          exit 0
        fi
        attempt=$$((attempt + 1))
        sleep 5
      done

      echo "Failed to pull $$embedding_model after $$max_attempts attempts"
      exit 1
    depends_on:
      ollama:
        condition: service_healthy

  redis:
    image: redis:7.4-alpine
    container_name: sai-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  postgres:
    image: pgvector/pgvector:pg16
    container_name: sai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sai_reminders
      POSTGRES_USER: postgresai
      POSTGRES_PASSWORD: aipostgresai
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgresai -d sai_reminders"]
      interval: 10s
      timeout: 5s
      retries: 8

  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    container_name: sai-etcd
    restart: unless-stopped
    command:
      - /usr/local/bin/etcd
      - --advertise-client-urls=http://etcd:2379
      - --listen-client-urls=http://0.0.0.0:2379
      - --data-dir=/etcd
    volumes:
      - milvus-etcd-data:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-02-07T23-21-09Z
    container_name: sai-minio
    restart: unless-stopped
    command: ["minio", "server", "/minio_data"]
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - milvus-minio-data:/minio_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  milvus:
    image: milvusdb/milvus:v2.5.6
    container_name: sai-milvus
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    ports:
      - "19530:19530"
      - "9091:9091"
    volumes:
      - milvus-data:/var/lib/milvus
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9091/healthz"]
      interval: 20s
      timeout: 10s
      retries: 10

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: sai-bot:latest
    container_name: sai-bot
    restart: unless-stopped
    working_dir: /app
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      OLLAMA_BASE_URL: http://ollama:11434
      MILVUS_HOST: milvus
      MILVUS_PORT: "19530"
      HF_HOME: /home/app/.cache/huggingface
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      REMINDER_DATABASE_URL: postgresql+psycopg://postgresai:aipostgresai@postgres:5432/sai_reminders
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: /app/src
    gpus: all
    volumes:
      - huggingface-cache:/home/app/.cache/huggingface
    command: ["sh", "-c", "alembic upgrade head && python -m search_agent.main"]
    depends_on:
      ollama-pull:
        condition: service_completed_successfully
      ollama:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      milvus:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: sai-bot:latest
    container_name: sai-api
    restart: unless-stopped
    working_dir: /app
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      OLLAMA_BASE_URL: http://ollama:11434
      MILVUS_HOST: milvus
      MILVUS_PORT: "19530"
      HF_HOME: /home/app/.cache/huggingface
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      REMINDER_DATABASE_URL: postgresql+psycopg://postgresai:aipostgresai@postgres:5432/sai_reminders
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: /app/src
    gpus: all
    volumes:
      - huggingface-cache:/home/app/.cache/huggingface
    command: ["sh", "-c", "alembic upgrade head && python -m search_agent.api_main"]
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    depends_on:
      ollama-pull:
        condition: service_completed_successfully
      ollama:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      milvus:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend-assistant
      dockerfile: Dockerfile
    image: sai-frontend:latest
    container_name: sai-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  ollama-data:
  postgres-data:
  huggingface-cache:
  milvus-data:
  milvus-etcd-data:
  milvus-minio-data:
