services:
  ollama:
    image: ollama/ollama:latest
    container_name: sai-ollama
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 5s
      retries: 10

  ollama-pull:
    image: ollama/ollama:latest
    container_name: sai-ollama-pull
    restart: "no"
    env_file:
      - .env
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command: |
      set -e
      model="$${OLLAMA_MODEL:-gpt-oss:120b-cloud}"
      echo "Waiting for Ollama API at $${OLLAMA_HOST}..."
      until ollama list >/dev/null 2>&1; do
        sleep 2
      done

      attempt=1
      max_attempts=5
      while [ "$$attempt" -le "$$max_attempts" ]; do
        echo "Pulling $$model (attempt $$attempt/$$max_attempts)..."
        if ollama pull "$$model"; then
          echo "Model $$model pulled successfully"
          exit 0
        fi
        attempt=$$((attempt + 1))
        sleep 5
      done

      echo "Failed to pull $$model after $$max_attempts attempts"
      exit 1
    depends_on:
      ollama:
        condition: service_healthy

  redis:
    image: redis:7.4-alpine
    container_name: sai-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: sai-bot:latest
    container_name: sai-bot
    restart: unless-stopped
    working_dir: /app
    env_file:
      - .env
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      PYTHONUNBUFFERED: "1"
    command: ["python", "-m", "search_agent.main"]
    depends_on:
      ollama-pull:
        condition: service_completed_successfully
      ollama:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  ollama-data:
