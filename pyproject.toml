[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sai-search-agent"
version = "0.1.0"
description = "Telegram search agent powered by Ollama, LangGraph, and LangSmith"
requires-python = ">=3.11"
dependencies = [
  "aiogram>=3.17.0",
  "fastapi>=0.116.0",
  "uvicorn[standard]>=0.35.0",
  "python-multipart>=0.0.9",
  "langgraph>=0.3.1",
  "langsmith>=0.3.18",
  "ollama>=0.5.4",
  "python-dotenv>=1.0.1",
  "redis>=5.2.1",
  "pdfkit>=1.0.0",
  "markdown>=3.7",
  "SQLAlchemy>=2.0.36",
  "alembic>=1.14.0",
  "psycopg[binary]>=3.2.3",
  "croniter>=2.0.7",
  "langchain>=0.3.27",
  "langchain-classic>=0.3.0",
  "langchain-community>=0.3.27",
  "langchain-core>=0.3.72",
  "langchain-text-splitters>=0.3.9"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
