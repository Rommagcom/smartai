name: Skill Manifest Security

on:
  pull_request:
    paths:
      - "skills/**"
      - "scripts/skill_manifest_security.py"
      - ".github/workflows/skill-manifest-security.yml"
  push:
    branches: [main]
    paths:
      - "skills/**"
      - "scripts/skill_manifest_security.py"
      - ".github/workflows/skill-manifest-security.yml"

jobs:
  verify-skill-manifests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Verify manifests
        env:
          DYNAMIC_SKILL_SIGNING_KEY: ${{ secrets.DYNAMIC_SKILL_SIGNING_KEY }}
        run: |
          python scripts/skill_manifest_security.py verify-all --skills-root skills
