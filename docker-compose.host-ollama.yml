services:
  hf-cache-init:
    build:
      context: .
      dockerfile: Dockerfile
    image: sai-bot:latest
    container_name: sai-hf-cache-init
    user: root
    restart: "no"
    command:
      - sh
      - -lc
      - mkdir -p /home/app/.cache/huggingface ; chown -R app:app /home/app/.cache ; chmod -R u+rwX /home/app/.cache
    volumes:
      - huggingface-cache:/home/app/.cache/huggingface

  redis:
    image: redis:7.4-alpine
    container_name: sai-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  postgres:
    image: pgvector/pgvector:pg16
    container_name: sai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sai_reminders
      POSTGRES_USER: postgresai
      POSTGRES_PASSWORD: aipostgresai
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgresai -d sai_reminders"]
      interval: 10s
      timeout: 5s
      retries: 8

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: sai-bot:latest
    container_name: sai-bot
    restart: unless-stopped
    working_dir: /app
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      REDIS_URL: redis://redis:6379/0
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      HF_HOME: /home/app/.cache/huggingface
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      REMINDER_DATABASE_URL: postgresql+psycopg://postgresai:aipostgresai@postgres:5432/sai_reminders
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: /app/src
    gpus: all
    volumes:
      - huggingface-cache:/home/app/.cache/huggingface
    command: ["sh", "-c", "alembic upgrade head && python -m search_agent.main"]
    depends_on:
      hf-cache-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: sai-bot:latest
    container_name: sai-api
    restart: unless-stopped
    working_dir: /app
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      REDIS_URL: redis://redis:6379/0
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      HF_HOME: /home/app/.cache/huggingface
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      REMINDER_DATABASE_URL: postgresql+psycopg://postgresai:aipostgresai@postgres:5432/sai_reminders
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: /app/src
    gpus: all
    volumes:
      - huggingface-cache:/home/app/.cache/huggingface
    command: ["sh", "-c", "alembic upgrade head && python -m search_agent.api_main"]
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    depends_on:
      hf-cache-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend-assistant
      dockerfile: Dockerfile
    image: sai-frontend:latest
    container_name: sai-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

  ubuntu-sandbox:
    build:
      context: ./sandbox-ubuntu
      dockerfile: Dockerfile
    image: sai-ubuntu-sandbox:latest
    container_name: sai-ubuntu-sandbox
    restart: unless-stopped
    environment:
      SANDBOX_USER: ${SANDBOX_USER:-aismartsandbox}
      SANDBOX_PASSWORD: ${SANDBOX_PASSWORD:-sandbox_smartai}
      ROOT_PASSWORD: ${SANDBOX_ROOT_PASSWORD:-sandbox_smartai}
    ports:
      - "2222:22"
    healthcheck:
      test: ["CMD-SHELL", "pgrep -x sshd >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  postgres-data:
  huggingface-cache:
