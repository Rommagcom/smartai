services:
  hf-cache-init:
    build:
      context: .
      dockerfile: Dockerfile
    image: sai-bot:latest
    container_name: sai-hf-cache-init
    user: root
    restart: "no"
    entrypoint:
      - /bin/sh
      - -lc
    command:
      - mkdir -p /home/app/.cache/huggingface ; chown -R app:app /home/app/.cache ; chmod -R u+rwX /home/app/.cache
    volumes:
      - huggingface-cache:/home/app/.cache/huggingface

  redis:
    image: redis:7.4-alpine
    container_name: sai-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  postgres:
    image: pgvector/pgvector:pg16
    container_name: sai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sai_reminders
      POSTGRES_USER: postgresai
      POSTGRES_PASSWORD: aipostgresai
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgresai -d sai_reminders"]
      interval: 10s
      timeout: 5s
      retries: 8

  vault:
    image: hashicorp/vault:1.17
    container_name: sai-vault
    restart: unless-stopped
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: root
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    command: server -dev
    ports:
      - "8200:8200"
    volumes:
      - vault-data:/vault/file
    healthcheck:
      test: ["CMD-SHELL", "VAULT_ADDR=http://127.0.0.1:8200 vault status >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: sai-bot:latest
    container_name: sai-bot
    restart: unless-stopped
    working_dir: /app
    entrypoint:
      - /bin/sh
      - -lc
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      REDIS_URL: redis://redis:6379/0
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      BYOB_VAULT_ADDR: http://vault:8200
      BYOB_VAULT_TOKEN: root
      BYOB_VAULT_MOUNT: secret
      HF_HOME: /home/app/.cache/huggingface
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      REMINDER_DATABASE_URL: postgresql+psycopg://postgresai:aipostgresai@postgres:5432/sai_reminders
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: /app/src
    gpus: all
    volumes:
      - huggingface-cache:/home/app/.cache/huggingface
    command:
      - alembic upgrade head && python -m search_agent.main
    depends_on:
      hf-cache-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      vault:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: sai-bot:latest
    container_name: sai-api
    restart: unless-stopped
    working_dir: /app
    entrypoint:
      - /bin/sh
      - -lc
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      REDIS_URL: redis://redis:6379/0
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      BYOB_VAULT_ADDR: http://vault:8200
      BYOB_VAULT_TOKEN: root
      BYOB_VAULT_MOUNT: secret
      HF_HOME: /home/app/.cache/huggingface
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      REMINDER_DATABASE_URL: postgresql+psycopg://postgresai:aipostgresai@postgres:5432/sai_reminders
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: /app/src
    gpus: all
    volumes:
      - huggingface-cache:/home/app/.cache/huggingface
    command:
      - alembic upgrade head && python -m search_agent.api_main
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    depends_on:
      hf-cache-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      vault:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend-assistant
      dockerfile: Dockerfile
    image: sai-frontend:latest
    container_name: sai-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
  huggingface-cache:
  vault-data:
